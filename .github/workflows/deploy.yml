name: Deploy Static Site to Hostinger

on:
    push:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: deploy-hostinger
    cancel-in-progress: true

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Build Static Export
              run: npm run build

            - name: Sanity-check the build
              run: |
                  test -f out/index.html || { echo "::error::out/index.html missing"; exit 1; }
                  echo "Files to ship: $(find out -type f | wc -l)"

            - name: Assemble the upload payload
              run: |
                  set -euo pipefail

                  TOKEN="$(openssl rand -hex 24)"
                  echo "::add-mask::$TOKEN"
                  echo "DEPLOY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

                  rm -rf upload
                  mkdir -p upload

                  # Zip the CONTENTS of out/, not the folder itself.
                  ( cd out && zip -qr ../upload/site.zip . )

                  test -f deploy/deploy-extract.php || {
                      echo "::error::deploy/deploy-extract.php not found in the repo"; exit 1;
                  }

                  sed "s|__DEPLOY_TOKEN__|${TOKEN}|g" deploy/deploy-extract.php > upload/deploy-extract.php

                  if grep -q '__DEPLOY_TOKEN__' upload/deploy-extract.php; then
                      echo "::error::token placeholder was not replaced"; exit 1
                  fi

                  ls -lh upload

            - name: Deploy to Hostinger via FTP
              uses: SamKirkland/FTP-Deploy-Action@v4.3.5
              with:
                  server: ${{ secrets.FTP_SERVER }}
                  username: ${{ secrets.FTP_USERNAME }}
                  password: ${{ secrets.FTP_PASSWORD }}
                  local-dir: ./upload/
                  server-dir: ./
                  # Fresh state name each run: the extractor deletes site.zip
                  # from the server, so a reused state file would wrongly
                  # decide the zip is already there and skip the upload.
                  state-name: .deploy-state-${{ github.run_id }}.json
                  dangerous-clean-slate: false

            - name: Extract on the server
              env:
                  SITE_URL: ${{ vars.SITE_URL || 'https://prodesignity.com' }}
              run: |
                  set -uo pipefail
                  BASE="${SITE_URL%/}"
                  echo "Calling ${BASE}/deploy-extract.php"

                  RESPONSE="$(curl -sS --fail-with-body --max-time 300 \
                      --get "${BASE}/deploy-extract.php" \
                      --data-urlencode "token=${DEPLOY_TOKEN}" \
                      --data "purge=1")" || {
                      echo "::error::Extractor call failed"
                      echo "$RESPONSE"
                      exit 1
                  }

                  echo "$RESPONSE"
                  echo "$RESPONSE" | head -n1 | grep -q '^OK$' || {
                      echo "::error::Extractor did not report OK"
                      exit 1
                  }

            - name: Verify the site responds
              env:
                  SITE_URL: ${{ vars.SITE_URL || 'https://prodesignity.com' }}
              run: |
                  BASE="${SITE_URL%/}"

                  CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${BASE}/")
                  echo "Homepage returned $CODE"
                  [ "$CODE" = "200" ] || { echo "::error::Homepage returned $CODE"; exit 1; }

                  LEFTOVER=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${BASE}/deploy-extract.php")
                  if [ "$LEFTOVER" = "200" ]; then
                      echo "::warning::deploy-extract.php is still on the server - delete it manually"
                  else
                      echo "Extractor is gone (HTTP $LEFTOVER)"
                  fi
