name: Deploy static site to Hostinger (zip + auto-extract)

on:
    push:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: deploy-hostinger
    cancel-in-progress: true

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Build static export
              run: npm run build

            - name: Sanity-check the build
              run: |
                  test -d out || { echo "::error::out/ directory missing - is output:'export' set in next.config?"; exit 1; }
                  test -f out/index.html || { echo "::error::out/index.html missing"; exit 1; }
                  echo "Files to ship: $(find out -type f | wc -l)"

            - name: Assemble the upload payload
              run: |
                  set -euo pipefail

                  # One-time token, masked so it never appears in the logs.
                  TOKEN="$(openssl rand -hex 24)"
                  echo "::add-mask::$TOKEN"
                  echo "DEPLOY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

                  rm -rf upload
                  mkdir -p upload

                  # Zip the CONTENTS of out/, not the folder itself.
                  ( cd out && zip -qr ../upload/site.zip . )

                  test -f deploy/deploy-extract.php || {
                      echo "::error::deploy/deploy-extract.php not found in the repo"; exit 1;
                  }

                  # Inject the token into a COPY - the repo file keeps its placeholder.
                  sed "s|__DEPLOY_TOKEN__|${TOKEN}|g" deploy/deploy-extract.php > upload/deploy-extract.php

                  if grep -q '__DEPLOY_TOKEN__' upload/deploy-extract.php; then
                      echo "::error::token placeholder was not replaced"; exit 1
                  fi

                  ls -lh upload

            - name: Upload zip + extractor over FTPS
              env:
                  FTP_SERVER: ${{ secrets.FTP_SERVER }}
                  FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
                  FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
                  # Optional repo variable. Leave unset if your FTP user already
                  # lands inside public_html; set it to public_html otherwise.
                  FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR }}
              run: |
                  set -euo pipefail

                  DIR="${FTP_REMOTE_DIR:-}"
                  DIR="${DIR#/}"; DIR="${DIR%/}"
                  BASE="ftp://${FTP_SERVER}/${DIR:+$DIR/}"

                  # Zip first, extractor second, so the extractor is never
                  # reachable before the archive it needs is in place.
                  for f in site.zip deploy-extract.php; do
                      echo "Uploading $f"
                      curl -sS --ssl-reqd --ftp-create-dirs --max-time 900 \
                           --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
                           -T "upload/$f" "$BASE"
                  done

                  echo "Upload finished."

            - name: Extract on the server
              env:
                  SITE_URL: ${{ vars.SITE_URL || 'https://prodesignity.com' }}
              run: |
                  set -uo pipefail

                  BASE="${SITE_URL%/}"
                  echo "Calling ${BASE}/deploy-extract.php"

                  RESPONSE="$(curl -sS --fail-with-body --max-time 300 \
                      --get "${BASE}/deploy-extract.php" \
                      --data-urlencode "token=${DEPLOY_TOKEN}" \
                      --data "purge=1")" || {
                      echo "::error::Extractor call failed"
                      echo "$RESPONSE"
                      exit 1
                  }

                  echo "$RESPONSE"
                  echo "$RESPONSE" | head -n1 | grep -q '^OK$' || {
                      echo "::error::Extractor did not report OK"
                      exit 1
                  }

            - name: Verify the site responds
              env:
                  SITE_URL: ${{ vars.SITE_URL || 'https://prodesignity.com' }}
              run: |
                  BASE="${SITE_URL%/}"

                  CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${BASE}/")
                  echo "Homepage returned $CODE"
                  [ "$CODE" = "200" ] || { echo "::error::Homepage returned $CODE"; exit 1; }

                  LEFTOVER=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${BASE}/deploy-extract.php")
                  if [ "$LEFTOVER" = "200" ]; then
                      echo "::warning::deploy-extract.php is still on the server - delete it manually"
                  else
                      echo "Extractor is gone (HTTP $LEFTOVER)"
                  fi
