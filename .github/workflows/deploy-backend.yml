name: Deploy Backend API to Hostinger

# Standalone Express API (npm + ESM) → Hostinger VPS via SSH.
# Secrets: SSH_HOST, SSH_USERNAME, SSH_PASSWORD, SSH_PORT, BACKEND_REMOTE_DIR
on:
    push:
        branches:
            - main
        paths:
            - "backend/**"
            - ".github/workflows/deploy-backend.yml"
    workflow_dispatch:
        inputs:
            run_migrations:
                description: "Run prisma db push before restart"
                type: boolean
                default: false

concurrency:
    group: deploy-backend
    cancel-in-progress: true

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Require deploy secrets
              working-directory: .
              env:
                  SSH_HOST: ${{ secrets.SSH_HOST }}
                  SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
                  SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
                  BACKEND_REMOTE_DIR: ${{ secrets.BACKEND_REMOTE_DIR }}
              run: |
                  set -euo pipefail
                  missing=0
                  for key in SSH_HOST SSH_USERNAME SSH_PASSWORD BACKEND_REMOTE_DIR; do
                    if [ -z "${!key}" ]; then
                      echo "::error::Missing secret: $key"
                      missing=1
                    fi
                  done
                  [ "$missing" = "0" ] || exit 1

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma client
              run: npx prisma generate

            - name: Build TypeScript
              run: npm run build

            - name: Sanity-check the build
              run: |
                  test -f dist/index.js || { echo "::error::dist/index.js missing"; exit 1; }
                  echo "Backend build OK"

            - name: Package release
              working-directory: .
              run: |
                  set -euo pipefail
                  rm -rf /tmp/api-release
                  mkdir -p /tmp/api-release
                  cp -r backend/dist /tmp/api-release/dist
                  cp -r backend/prisma /tmp/api-release/prisma
                  cp backend/package.json /tmp/api-release/package.json
                  cp backend/package-lock.json /tmp/api-release/package-lock.json
                  cp backend/prisma.config.ts /tmp/api-release/prisma.config.ts
                  mkdir -p /tmp/api-release/uploads
                  tar -C /tmp/api-release -czf api-release.tgz .
                  mv api-release.tgz backend/api-release.tgz
                  ls -lh backend/api-release.tgz

            - name: Upload release via SCP
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  password: ${{ secrets.SSH_PASSWORD }}
                  port: ${{ secrets.SSH_PORT }}
                  source: backend/api-release.tgz
                  target: /tmp/
                  overwrite: true

            - name: Extract, install, restart on server
              uses: appleboy/ssh-action@v1.2.0
              env:
                  REMOTE_DIR: ${{ secrets.BACKEND_REMOTE_DIR }}
                  RUN_MIGRATIONS: ${{ github.event.inputs.run_migrations || 'false' }}
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  password: ${{ secrets.SSH_PASSWORD }}
                  port: ${{ secrets.SSH_PORT }}
                  script_stop: true
                  envs: REMOTE_DIR,RUN_MIGRATIONS
                  script: |
                      set -euo pipefail
                      echo "Deploying to $REMOTE_DIR"
                      mkdir -p "$REMOTE_DIR"
                      # scp may nest as /tmp/backend/api-release.tgz
                      ARCHIVE="/tmp/api-release.tgz"
                      if [ ! -f "$ARCHIVE" ] && [ -f /tmp/backend/api-release.tgz ]; then
                        ARCHIVE=/tmp/backend/api-release.tgz
                      fi
                      tar -xzf "$ARCHIVE" -C "$REMOTE_DIR"
                      rm -f "$ARCHIVE" /tmp/backend/api-release.tgz
                      cd "$REMOTE_DIR"

                      test -f .env || {
                        echo "Missing $REMOTE_DIR/.env — create it once on the VPS"
                        exit 1
                      }

                      export NVM_DIR="$HOME/.nvm"
                      [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

                      npm ci --omit=dev
                      npx prisma generate

                      if [ "$RUN_MIGRATIONS" = "true" ]; then
                        npx prisma db push
                      fi

                      if command -v pm2 >/dev/null 2>&1; then
                        if pm2 describe prodesignity-api >/dev/null 2>&1; then
                          pm2 restart prodesignity-api --update-env
                        else
                          pm2 start dist/index.js --name prodesignity-api
                        fi
                        pm2 save
                      else
                        echo "pm2 not found. Install once: npm i -g pm2"
                        exit 1
                      fi

                      echo "Backend deployed"

            - name: Health check
              working-directory: .
              env:
                  API_URL: ${{ vars.API_URL || 'https://api.prodesignity.com' }}
              run: |
                  set -euo pipefail
                  BASE="${API_URL%/}"
                  echo "Checking ${BASE}/api/health"
                  for i in 1 2 3 4 5 6; do
                    CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 20 "${BASE}/api/health" || true)
                    echo "Attempt $i → HTTP $CODE"
                    if [ "$CODE" = "200" ]; then
                      cat /tmp/health.json || true
                      exit 0
                    fi
                    sleep 5
                  done
                  echo "::error::API health check failed"
                  exit 1
