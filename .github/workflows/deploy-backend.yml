name: Deploy Backend (SSH)

# Build Express API in CI (pnpm), then sync to Hostinger Node host over SSH.
# Server installs with npm — avoids Hostinger corepack/pnpm failures.
on:
    push:
        branches:
            - main
        paths:
            - "backend/**"
            - ".github/workflows/deploy-backend.yml"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
    workflow_dispatch:

concurrency:
    group: deploy-backend-ssh
    cancel-in-progress: true

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  # version comes from package.json "packageManager"
                  run_install: false

            - name: Install dependencies
              run: pnpm install --filter prodesignity-api...

            - name: Generate Prisma client + build
              working-directory: backend
              env:
                  # prisma.config.ts reads DATABASE_URL; generate does not need a live DB
                  DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
              run: |
                  pnpm exec prisma generate
                  pnpm run build
                  test -f dist/index.js

            - name: Assemble deploy payload
              run: |
                  set -euo pipefail
                  rm -rf backend-deploy
                  mkdir -p backend-deploy
                  cp -r backend/dist backend/prisma backend-deploy/
                  cp backend/package.json backend/prisma.config.ts backend-deploy/
                  if [ -f backend/.npmrc ]; then cp backend/.npmrc backend-deploy/; fi
                  # Keep empty upload dirs so multer paths exist; do not wipe server uploads
                  mkdir -p backend-deploy/uploads/site backend-deploy/uploads/team \
                    backend-deploy/uploads/users backend-deploy/uploads/assets
                  find backend-deploy -type f | wc -l

            - name: Pack backend
              run: |
                  set -euo pipefail
                  tar -czf backend-deploy.tar.gz -C backend-deploy .
                  ls -lh backend-deploy.tar.gz

            - name: Upload archive
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  password: ${{ secrets.SSH_PASSWORD }}
                  port: ${{ vars.SSH_PORT || 22 }}
                  source: "backend-deploy.tar.gz"
                  target: "/tmp"
                  overwrite: true

            - name: Extract, install, restart
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  password: ${{ secrets.SSH_PASSWORD }}
                  port: ${{ vars.SSH_PORT || 22 }}
                  script_stop: true
                  script: |
                      set -euo pipefail
                      REMOTE="${{ vars.BACKEND_REMOTE_PATH }}"
                      ARCHIVE="/tmp/backend-deploy.tar.gz"
                      test -f "$ARCHIVE"
                      test -d "$REMOTE"

                      if [ ! -f "$REMOTE/.env" ]; then
                        echo "Missing $REMOTE/.env — create it once in hPanel/SSH before deploy"
                        exit 1
                      fi

                      # Preserve runtime data across deploys
                      KEEP_ENV="$REMOTE/.env"
                      KEEP_UPLOADS="$REMOTE/uploads"
                      TMP=$(mktemp -d)
                      cp -a "$KEEP_ENV" "$TMP/.env"
                      if [ -d "$KEEP_UPLOADS" ]; then cp -a "$KEEP_UPLOADS" "$TMP/uploads"; fi

                      # Replace app files (not wiping whole domain root blindly)
                      for item in dist prisma package.json prisma.config.ts .npmrc package-lock.json; do
                        rm -rf "$REMOTE/$item"
                      done
                      tar -xzf "$ARCHIVE" -C "$REMOTE"

                      cp -a "$TMP/.env" "$REMOTE/.env"
                      if [ -d "$TMP/uploads" ]; then
                        mkdir -p "$REMOTE/uploads"
                        cp -a "$TMP/uploads/." "$REMOTE/uploads/"
                      fi
                      rm -rf "$TMP" "$ARCHIVE"

                      cd "$REMOTE"
                      # Hostinger Node: npm works; hPanel pnpm/corepack often breaks
                      npm install --omit=dev --no-fund --no-audit
                      npx prisma generate

                      mkdir -p tmp uploads/site uploads/team uploads/users uploads/assets
                      touch tmp/restart.txt

                      if command -v pm2 >/dev/null 2>&1; then
                        pm2 describe prodesignity-api >/dev/null 2>&1 \
                          && pm2 restart prodesignity-api --update-env \
                          || pm2 start dist/index.js --name prodesignity-api
                        pm2 save || true
                      fi

                      echo "Backend deploy OK → $REMOTE"

            - name: Health check
              env:
                  API_URL: ${{ vars.API_URL || 'https://api.prodesignity.com' }}
              run: |
                  set -euo pipefail
                  BASE="${API_URL%/}"
                  CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${BASE}/" || true)
                  echo "API root HTTP $CODE"
                  # 200/404/401 all mean the Node process is up; 000/5xx = down
                  case "$CODE" in
                    2*|3*|401|403|404) echo "OK" ;;
                    *) echo "::warning::Unexpected status $CODE — check hPanel Node app + .env" ;;
                  esac
