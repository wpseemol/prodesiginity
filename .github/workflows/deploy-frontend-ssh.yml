name: Deploy Frontend (SSH)

# Build static Next export in CI, then extract into Hostinger public_html over SSH.
on:
    push:
        branches:
            - main
        paths:
            - "frontend/**"
            - ".github/workflows/deploy-frontend-ssh.yml"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
    workflow_dispatch:

concurrency:
    group: deploy-frontend-ssh
    cancel-in-progress: true

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  # version comes from package.json "packageManager"
                  run_install: false

            - name: Install dependencies
              run: pnpm install --filter prodesignity...

            - name: Build static site
              working-directory: frontend
              run: |
                  pnpm run build
                  test -f out/index.html

            - name: Pack site
              run: |
                  set -euo pipefail
                  rm -f site.tar.gz
                  ( cd frontend/out && tar -czf ../../site.tar.gz . )
                  ls -lh site.tar.gz

            - name: Upload archive
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  password: ${{ secrets.SSH_PASSWORD }}
                  port: ${{ vars.SSH_PORT || 65002 }}
                  source: "site.tar.gz"
                  target: "/tmp"
                  overwrite: true

            - name: Extract on server
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  password: ${{ secrets.SSH_PASSWORD }}
                  port: ${{ vars.SSH_PORT || 65002 }}
                  script_stop: true
                  script: |
                      set -euo pipefail
                      REMOTE="${{ vars.FRONTEND_REMOTE_PATH }}"
                      ARCHIVE="/tmp/site.tar.gz"
                      test -f "$ARCHIVE"
                      test -d "$REMOTE"

                      # Preserve hosting-only files Hostinger / custom config
                      KEEP=".htaccess .user.ini php.ini error_log .well-known cgi-bin"
                      TMP=$(mktemp -d)
                      for f in $KEEP; do
                        if [ -e "$REMOTE/$f" ]; then
                          cp -a "$REMOTE/$f" "$TMP/" || true
                        fi
                      done

                      # Fresh extract (static export is fully replaced each deploy)
                      find "$REMOTE" -mindepth 1 -maxdepth 1 \
                        ! -name '.htaccess' \
                        ! -name '.user.ini' \
                        ! -name 'php.ini' \
                        ! -name 'error_log' \
                        ! -name '.well-known' \
                        ! -name 'cgi-bin' \
                        -exec rm -rf {} +

                      tar -xzf "$ARCHIVE" -C "$REMOTE"
                      for f in $KEEP; do
                        if [ -e "$TMP/$f" ] && [ ! -e "$REMOTE/$f" ]; then
                          cp -a "$TMP/$f" "$REMOTE/"
                        fi
                      done
                      # Prefer server .htaccess if both exist
                      if [ -e "$TMP/.htaccess" ]; then
                        cp -a "$TMP/.htaccess" "$REMOTE/.htaccess"
                      fi

                      rm -rf "$TMP" "$ARCHIVE"
                      echo "Frontend deploy OK → $REMOTE"
                      ls "$REMOTE" | head

            - name: Verify site
              env:
                  SITE_URL: ${{ vars.SITE_URL || 'https://prodesignity.com' }}
              run: |
                  set -euo pipefail
                  BASE="${SITE_URL%/}"
                  CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${BASE}/")
                  echo "Homepage HTTP $CODE"
                  [ "$CODE" = "200" ] || { echo "::error::Homepage returned $CODE"; exit 1; }
