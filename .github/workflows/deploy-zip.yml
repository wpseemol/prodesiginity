name: Deploy via Zip (FTP push + server-side unzip)

# ---------------------------------------------------------------------------
# WHY THIS EXISTS
#
# deploy.yml uploads ./out file by file over FTP. That works, but a Next export
# is thousands of small files and FTP opens a connection per file, so most of
# the job is round-trip latency rather than transfer.
#
# This workflow uploads TWO files instead: site.zip and a one-shot PHP
# extractor. It then calls the extractor over HTTPS, which unzips on the server
# and deletes both itself and the archive.
#
# IS THAT POSSIBLE ON HOSTINGER? Yes — it needs PHP with the zip extension,
# which shared plans have. Pure FTP cannot unzip; something on the server has
# to do it, and PHP is the only thing guaranteed to be there. If your plan
# includes SSH, an appleboy/ssh-action step running `unzip -o` is simpler and
# you can drop the PHP file entirely.
#
# ---------------------------------------------------------------------------
# THIS DOES NOT REPLACE deploy.yml.
#
# The trigger is workflow_dispatch only, so nothing changes until you run it by
# hand from the Actions tab. Once you have seen it work, swap the triggers:
# move `on: push: branches: [main]` here and set deploy.yml to
# workflow_dispatch. Do not leave both on push — they would race each other.
# ---------------------------------------------------------------------------

on:
    workflow_dispatch:
        inputs:
            purge:
                description: "Delete server files that are not in this build"
                type: boolean
                default: false

# One deploy at a time. Two concurrent runs would upload two different zips
# against one extractor filename.
concurrency:
    group: deploy-zip
    cancel-in-progress: false

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Build Static Export
              run: npm run build

            - name: Sanity-check the build
              # A broken build that still exits 0 would otherwise be zipped and
              # shipped over a working site.
              run: |
                  test -f out/index.html || { echo "::error::out/index.html missing"; exit 1; }
                  echo "Files to ship: $(find out -type f | wc -l)"

            - name: Mint a one-time deploy token
              run: echo "DEPLOY_TOKEN=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

            - name: Assemble the upload payload
              # Only these two files are sent over FTP.
              run: |
                  mkdir -p upload
                  ( cd out && zip -qr ../upload/site.zip . )
                  sed "s/__DEPLOY_TOKEN__/${DEPLOY_TOKEN}/" \
                      deploy/deploy-extract.php > upload/deploy-extract.php
                  ls -lh upload

            - name: Upload zip + extractor via FTP
              uses: SamKirkland/FTP-Deploy-Action@v4.3.5
              with:
                  server: ${{ secrets.FTP_SERVER }}
                  username: ${{ secrets.FTP_USERNAME }}
                  password: ${{ secrets.FTP_PASSWORD }}
                  local-dir: ./upload/
                  server-dir: ./
                  # NEVER enable clean-slate here: the payload is two files, so
                  # it would wipe the site and then unzip into nothing.
                  dangerous-clean-slate: false
                  # A separate state file so this workflow and deploy.yml do not
                  # overwrite each other's sync state.
                  state-name: .ftp-deploy-zip-state.json

            - name: Extract on the server
              env:
                  SITE_URL: ${{ vars.SITE_URL || 'https://prodesignity.com' }}
                  PURGE: ${{ inputs.purge && '1' || '0' }}
              run: |
                  URL="${SITE_URL%/}/deploy-extract.php?token=${DEPLOY_TOKEN}&purge=${PURGE}"
                  echo "Calling ${SITE_URL%/}/deploy-extract.php"

                  # --fail-with-body so a PHP error message reaches the log
                  # instead of being swallowed by a bare non-zero exit.
                  RESPONSE=$(curl -sS --fail-with-body --max-time 180 "$URL") || {
                      echo "::error::Extractor call failed"
                      echo "$RESPONSE"
                      exit 1
                  }

                  echo "$RESPONSE"
                  echo "$RESPONSE" | head -n1 | grep -q '^OK$' || {
                      echo "::error::Extractor did not report OK"
                      exit 1
                  }

            - name: Verify the site responds
              env:
                  SITE_URL: ${{ vars.SITE_URL || 'https://prodesignity.com' }}
              run: |
                  CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${SITE_URL%/}/")
                  echo "Homepage returned $CODE"
                  [ "$CODE" = "200" ] || { echo "::error::Homepage returned $CODE"; exit 1; }
